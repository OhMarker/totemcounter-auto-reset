# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 1.21.11 toolchain (same versions as the PrismHUD build, verified against Fabric meta)
minecraft_version=1.21.11
loader_version=0.19.5
fabric_version=0.141.6+1.21.11
loom_version=1.17.20

# uku's mods, resolved from the Modrinth Maven (https://api.modrinth.com/maven) at build time.
# They are compile/run dependencies only and are NOT bundled into the built jar.
totemcounter_version=1.11.1+mc1.21.11
ukulib_version=1.10.1+1.21.11
# Mod Menu (optional at runtime; compiled against for the Configure button)
modmenu_version=17.0.0
placeholder_api_version=2.8.2+1.21.10

# Mod
mod_version=1.0.0+1.21.11
modrinth_slug=totemcounter-auto-reset
maven_group=com.ohmarker
archives_base_name=totemautoreset
